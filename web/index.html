<!doctype html>

<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Z72 · 固件交互台</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/console.js" defer></script>
</head>
<body>
  <main>
    <header>
      <a class="brand" href="/" aria-label="Z72 交互台首页">Z72<span>固件交互台</span></a>
      <span id="connection" class="pill" role="status">连接中</span>
    </header>
    <div class="workspace">
      <section class="viewer" aria-label="模拟器画面">
        <div class="section-bar"><span>显示画面</span><span id="frame-state">等待首帧</span></div>
        <div class="screen">
          <img id="frame" width="720" height="480" alt="模拟器实时画面" hidden>
          <div id="placeholder"><span class="loader"></span><strong>正在连接模拟器</strong><p>冷启动可能需要几分钟，请保持页面打开。</p></div>
        </div>
        <div class="viewer-footer"><span id="application">前台应用 · —</span><span id="uptime">00:00</span></div>
      </section>
      <aside>
        <div class="eyebrow">CONTROL PANEL</div>
        <h1>从这里操作。</h1>
        <p class="intro">按住按键发送输入，松开即释放。画面会随模拟器运行持续更新。</p>
        <div class="primary-keys">
          <button class="key menu" data-pin="9" disabled><span>MENU</span><span class="key-detail">菜单 <kbd>M</kbd></span></button>
          <button class="key" data-pin="8" disabled><span>PLAY</span><span class="key-detail">播放 <kbd>P</kbd></span></button>
          <button class="key" data-pin="3" disabled><span>OK</span><span class="key-detail">确认 <kbd>↵</kbd></span></button>
        </div>
        <div class="navigation" aria-label="方向键">
          <button class="key up" data-pin="5" aria-label="向上" disabled>↑</button>
          <button class="key left" data-pin="7" aria-label="向左" disabled>←</button>
          <span class="navigation-center" aria-hidden="true">NAV</span>
          <button class="key right" data-pin="6" aria-label="向右" disabled>→</button>
          <button class="key down" data-pin="4" aria-label="向下" disabled>↓</button>
        </div>
        <p class="hint">打开菜单时，请按住 MENU，待画面切换后再松开。当前固件的其他交互仍在完善。</p>
        <button id="release" class="secondary" disabled>释放全部按键 <kbd>Esc</kbd></button>
        <details>
          <summary>扩展按键 <span>24</span></summary>
          <p class="hint">编号对应独立输入，部分按键功能尚未确认。</p>
          <div id="extra-keys" class="extra-keys"></div>
        </details>
        <div class="session">
          <label class="toggle"><input id="live" type="checkbox" checked>持续刷新画面</label>
          <button id="restart" class="text-button">重启模拟器 <span>↻</span></button>
        </div>
      </aside>
    </div>
    <div id="notice" role="status" aria-live="polite">正在启动模拟器…</div>
    <footer><span>Z72 QEMU · 实验环境</span><span>失去窗口焦点时自动释放输入</span></footer>
  </main>
</body>
</html>
